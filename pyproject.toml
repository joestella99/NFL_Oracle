[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-oracle"
version = "0.1.0"
description = "NFL moneyline probability experiment with chronological backtesting and no-bet safeguards"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1", "numpy>=1.26", "scikit-learn>=1.3", "nflreadpy>=0.1.2", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.7"]

[project.scripts]
nfl-oracle = "nfl_oracle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
