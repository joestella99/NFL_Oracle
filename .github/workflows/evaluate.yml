name: NFL Oracle tests and historical replay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/evaluate.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Unit tests
        run: PYTHONPATH=src:. pytest -q
      - name: Real held-out 2025 season
        run: nfl-oracle backtest --seasons 2020 2021 2022 2023 2024 2025 --test-year 2025 --output results/season_2025
      - name: Replay Oct 8-12 2026 against final scores
        run: python scripts/replay_last_week.py
      - name: Replay 2026 weeks 1-5 and audit prediction confidence
        run: python scripts/replay_weeks.py --season 2026 --weeks 1 2 3 4 5 --output results/weeks_1_5_2026
      - name: Replay Weeks 1-5 with QB and EPA features
        run: python scripts/replay_weeks.py --with-pbp --output results/weeks_1_5_2026_advanced
      - name: Replay Weeks 1-5 without sportsbook inputs
        run: python scripts/replay_weeks.py --with-pbp --market-blind --output results/weeks_1_5_2026_market_blind
      - name: Calibrate 2026 probabilities on 2025 held-out predictions
        run: python scripts/calibrate_probabilities.py --calibration results/season_2025/backtest_predictions.csv --evaluation results/weeks_1_5_2026_advanced/predictions.csv --evaluation-season 2026 --output results/calibrated_2026
      - name: Prior-season winner decision threshold evaluation
        run: python scripts/choose_winner_decisions.py --selection results/season_2025/backtest_predictions.csv --evaluation results/weeks_1_5_2026_advanced/predictions.csv --evaluation-season 2026 --output results/winner_decisions_2026
      - name: Audit Week 1-5 prediction errors and market dependence
        run: python scripts/audit_errors.py --predictions results/weeks_1_5_2026_advanced/predictions.csv --output results/error_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfl-oracle-evaluation
          path: results/
