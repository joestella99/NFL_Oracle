name: CFB 2016-2025 walk-forward replay
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cfb_ten_year.py'
      - 'tests/test_cfb_ten_year.py'
      - '.github/workflows/cfb_ten_year.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ten_year:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install pandas numpy scikit-learn requests pytest
      - name: Unit tests and chronology safeguards
        run: PYTHONPATH=. pytest -q tests/test_cfb_ten_year.py
      - name: 2016-2025 walk-forward research replay
        run: PYTHONPATH=. python scripts/cfb_ten_year.py --output results/cfb_ten_year
      - name: Archive detailed results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-ten-season-replay
          path: results/cfb_ten_year/
      - name: Publish audited results to source repository
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/cfb_ten_year/
          if ! git diff --cached --quiet; then
            git commit -m "Archive CFB 2016-2025 research replay outputs"
            git push origin HEAD:main
          fi
